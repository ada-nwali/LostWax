[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
fs_permissions = [
  { access = "read-write", path = "./deployments" },
  { access = "read-write", path = "../frontend/src/config" },
]

[rpc_endpoints]
unichain_sepolia = "${UNICHAIN_SEPOLIA_RPC_URL}"

[etherscan]
unichain_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 1301, url = "https://api-sepolia.uniscan.xyz/api" }

[fmt]
line_length = 120

[lint]
exclude_lints = ["unsafe-typecast", "mixed-case-variable", "mixed-case-function", "screaming-snake-case-immutable"]
